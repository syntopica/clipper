<!doctype html>
<meta charset="utf-8" />
<title>brain clipper settings</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 2rem; max-width: 34rem; }
  label { display: block; margin: 0.75rem 0 0.25rem; }
  input { width: 100%; padding: 0.4rem; }
  .row { display: flex; gap: 0.5rem; margin-top: 1rem; }
  #authState { margin: 0; }
  #deviceCode { margin-top: 1rem; padding: 0.75rem; border: 1px solid #ccc; }
  #userCode { font: 700 1.6rem ui-monospace, monospace; letter-spacing: 0.2em; margin: 0.25rem 0; }
  #status { margin-top: 1rem; min-height: 1.2em; }
</style>
<h1>brain clipper</h1>

<p id="authState"></p>
<div class="row">
  <button id="signIn">Sign in with GitHub</button>
  <button id="signOut">Sign out on this device</button>
  <button id="openGithub">Open GitHub to revoke access</button>
</div>
<div id="deviceCode" hidden>
  <p>Enter this code on GitHub, then leave this page open:</p>
  <p id="userCode"></p>
  <p><a id="verificationLink" target="_blank" rel="noreferrer noopener">Open the GitHub page</a></p>
</div>

<label for="owner">Owner</label><input id="owner" />
<label for="repo">Repo</label><input id="repo" />
<label for="branch">Branch</label><input id="branch" />
<label for="githubAppClientId">GitHub App client id</label><input id="githubAppClientId" />
<label for="captureServiceOrigin">Capture service origin (optional)</label><input id="captureServiceOrigin" placeholder="https://capture.example.com" />
<label for="machineName">Machine name (recorded as clipped_from, stays on this device)</label>
<input id="machineName" />
<label for="captureToken"
  >Capture token (colours the toolbar icon; leave empty and the icon stays grey)</label
>
<input id="captureToken" type="password" autocomplete="off" />
<div class="row">
  <button id="save">Save</button>
</div>
<p id="status"></p>
<script src="options.js"></script>
